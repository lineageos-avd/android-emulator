name: Verify Windows SDK artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed source build run; leave empty to inspect the installed Microsoft runtime
        type: string
        required: false
        default: ''
permissions:
  actions: read
  contents: read
jobs:
  verify:
    if: github.repository == 'lineageos-avd/android-emulator'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned PE inspection dependency
        run: python -m pip install --require-hashes -r scripts/requirements-windows-qa.txt
      - name: Inspect the installed compatible Microsoft runtime
        if: inputs.run_id == ''
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/setup-windows.ps1), [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          @'
          import importlib.util, json, pathlib
          spec = importlib.util.spec_from_file_location('packager', 'scripts/repackage-windows-runtime.py')
          import sys
          sys.path.insert(0, 'scripts')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          directory = module.find_redist()
          record = {'status': 'passed', 'directory': str(directory), 'signatures': module.signatures(directory), **module.audit(directory)}
          pathlib.Path('evidence').mkdir(exist_ok=True)
          pathlib.Path('evidence/runtime-inspection.json').write_text(json.dumps(record, indent=2))
          print(json.dumps({'directory': str(directory), 'runtime': record['vc_runtime']}, indent=2))
          '@ | python -
      - name: Validate the producing workflow and download its immutable artifact
        if: inputs.run_id != ''
        shell: pwsh
        env:
          BUILD_RUN_ID: ${{ inputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import json, os, pathlib, subprocess
          run_id = os.environ['BUILD_RUN_ID']
          if not run_id.isdecimal():
              raise SystemExit('run_id must be a numeric GitHub Actions run ID')
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          if run['path'] != '.github/workflows/build.yml' or run['status'] != 'completed':
              raise SystemExit('Expected a completed source engine build workflow')
          jobs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/jobs']))
          if not any(job['name'] == 'build (windows-x86_64)' and job['conclusion'] == 'success' for job in jobs['jobs']):
              raise SystemExit('The producing Windows build and upstream tests did not succeed')
          pathlib.Path('evidence').mkdir(exist_ok=True)
          pathlib.Path('evidence/producing-run.json').write_text(json.dumps({key: run[key] for key in ('id', 'head_sha', 'html_url', 'path')}, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('EXPECTED_RECIPE_COMMIT=' + run['head_sha'] + '\n')
          subprocess.run(['gh', 'run', 'download', run_id, '--repo', repo, '--name', 'engine-windows-x86_64', '--dir', 'dist'], check=True)
          '@ | python -
      - name: Package compatible signed Microsoft runtime files
        if: inputs.run_id != ''
        shell: pwsh
        env:
          PACKAGING_COMMIT: ${{ github.sha }}
        run: python scripts/repackage-windows-runtime.py --dist dist --expected-recipe-commit "$env:EXPECTED_RECIPE_COMMIT" --packaging-commit "$env:PACKAGING_COMMIT"
      - name: Verify SHA256 and run the extracted Windows executable
        if: inputs.run_id != ''
        shell: pwsh
        run: python scripts/verify-sdk.py --dist dist --target windows-x86_64 --output evidence/sdk-verification-windows-x86_64.json --expected-recipe-commit "$env:EXPECTED_RECIPE_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-verification-windows-x86_64
          path: |
            evidence/*.json
            dist/windows-dependencies.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: inputs.run_id != ''
        with:
          name: engine-windows-x86_64-verified
          path: dist/*
          if-no-files-found: error

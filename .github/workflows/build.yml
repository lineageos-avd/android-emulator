name: Source engine build
on:
  push:
    branches: [main]
    tags: ['engine-*']
    paths: ['default.xml', 'upstream.json', 'patches/**']
  workflow_dispatch:
    inputs:
      target:
        description: Target to build (tags always build all targets)
        type: choice
        default: all
        options: [all, linux-x86_64, windows-x86_64, darwin-x86_64, darwin-aarch64]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'lineageos-avd/android-emulator'
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target != 'all' && format('["{0}"]', inputs.target) || '["linux-x86_64", "windows-x86_64", "darwin-x86_64", "darwin-aarch64"]') }}
    runs-on: ${{ fromJSON('{"linux-x86_64":["self-hosted","Linux","X64","emulator-linux"],"windows-x86_64":"windows-2022","darwin-x86_64":"macos-15-intel","darwin-aarch64":"macos-15"}')[matrix.target] }}
    concurrency:
      group: engine-${{ matrix.target }}
      cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'windows-x86_64' || inputs.target == 'darwin-x86_64') }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate isolated source and output directories
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo "ENGINE_SOURCE=$RUNNER_WORKSPACE/../engine-source" >> "$GITHUB_ENV"
            echo "ENGINE_OUT=$RUNNER_WORKSPACE/../engine-out" >> "$GITHUB_ENV"
          else
            echo "ENGINE_SOURCE=$RUNNER_TEMP/engine-source" >> "$GITHUB_ENV"
            echo "ENGINE_OUT=$RUNNER_TEMP/engine-out" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - name: Reclaim unused SDK space on disposable macOS runner
        if: runner.os == 'macOS'
        run: python3 scripts/prepare-runner.py
      - uses: cachix/install-nix-action@v31
        if: runner.os == 'macOS'
      - name: Install the compatible Windows C++ toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows.ps1
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
          toolset: '14.34'
      - name: Enable Windows symlinks and long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.symlinks true
          git config --global core.autocrlf false
      - name: Checkout immutable upstream source
        if: runner.os != 'Linux'
        shell: bash
        env:
          RECIPE_REVISION: ${{ github.sha }}
        run: python scripts/sync.py --source "$ENGINE_SOURCE" --jobs 8 --revision "$RECIPE_REVISION"
      - name: Checkout immutable upstream source in Nix on Linux
        if: runner.os == 'Linux'
        env:
          RECIPE_REVISION: ${{ github.sha }}
          EMULATOR_AOSP_MIRROR: ${{ vars.AOSP_MIRROR_LINUX }}
        run: nix develop -c python3 scripts/sync.py --source "$ENGINE_SOURCE" --jobs 8 --revision "$RECIPE_REVISION"
      - name: Compile and run upstream tests on Linux
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # These variables expand inside the FHS shell.
          # shellcheck disable=SC2016
          nix run . -- -c 'python3 scripts/build.py --source "$ENGINE_SOURCE" --target "$TARGET" --out "$ENGINE_OUT" --dist "$GITHUB_WORKSPACE/dist" --build-number "$GITHUB_RUN_NUMBER"'
      - name: Compile and run upstream tests on macOS
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: nix develop -c python3 scripts/build.py --source "$ENGINE_SOURCE" --target "$TARGET" --out "$ENGINE_OUT" --dist dist --build-number "$GITHUB_RUN_NUMBER" --skip-acceleration-check
      - name: Verify the pinned Clang and Windows STL pair
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows.ps1 -VerifyOnly -Source $env:ENGINE_SOURCE
      - name: Compile and run upstream tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: python scripts/build.py --source "$env:ENGINE_SOURCE" --target "$env:TARGET" --out "$env:ENGINE_OUT" --dist dist --build-number "$env:GITHUB_RUN_NUMBER" --skip-acceleration-check
      - name: Record shipped Linux ELF requirements
        if: runner.os == 'Linux'
        run: |
          # Expand paths in the FHS shell.
          # shellcheck disable=SC2016
          nix run . -- -c 'python3 scripts/elf-requirements.py --sdk "$ENGINE_OUT/distribution/emulator" --output dist/elf-requirements-linux-x86_64.json'
      - name: Verify the extracted Linux SDK in Nix
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          RECIPE_COMMIT: ${{ github.sha }}
        run: |
          # Expand paths and the immutable source revision inside the FHS shell.
          # shellcheck disable=SC2016
          nix run . -- -c 'python3 scripts/verify-sdk.py --dist dist --target "$TARGET" --expected-recipe-commit "$RECIPE_COMMIT" --output "dist/sdk-verification-$TARGET.json"'
      - name: Verify the extracted native macOS SDK
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          RECIPE_COMMIT: ${{ github.sha }}
        run: nix develop -c python3 scripts/verify-sdk.py --dist dist --target "$TARGET" --expected-recipe-commit "$RECIPE_COMMIT" --output "dist/sdk-verification-$TARGET.json"
      - name: Package and verify the compatible Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RECIPE_COMMIT: ${{ github.sha }}
        run: |
          python -m pip install --require-hashes -r scripts/requirements-windows-qa.txt
          python scripts/repackage-windows-runtime.py --dist dist --expected-recipe-commit "$env:RECIPE_COMMIT" --packaging-commit "$env:RECIPE_COMMIT"
          python scripts/verify-sdk.py --dist dist --target windows-x86_64 --expected-recipe-commit "$env:RECIPE_COMMIT" --output dist/sdk-verification-windows-x86_64.json
      - name: Export corresponding source
        if: runner.os == 'Linux'
        run: python3 scripts/source-archive.py --source "$ENGINE_SOURCE" --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: |
            dist/sdk-repo-*-emulator-*.zip
            dist/provenance-*.json
            dist/elf-requirements-*.json
            dist/sdk-verification-*.json
            dist/windows-dependencies.json
            dist/NOTICE.MSVC-RUNTIME.txt
            dist/manifest-*.xml
            dist/SHA256SUMS-*
            dist/SOURCE_OFFER.md
            dist/engine-corresponding-source.tar.gz*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/engine-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/catalog.py --dist dist --tag "$GITHUB_REF_NAME" --require-all-targets
      - name: Publish complete preview build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Android Emulator $GITHUB_REF_NAME" --notes-file SOURCE_OFFER.md --prerelease
      - name: Update public catalog after publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/contents/catalog.json?ref=main" --jq .sha > current-sha
          python3 - <<'PYTHON'
          import base64, json, pathlib
          payload = {"message": "Update compiled preview engine catalog", "branch": "main", "sha": pathlib.Path("current-sha").read_text().strip(), "content": base64.b64encode(pathlib.Path("dist/catalog.json").read_bytes()).decode()}
          pathlib.Path("catalog-update.json").write_text(json.dumps(payload))
          PYTHON
          gh api --method PUT "repos/$GH_REPO/contents/catalog.json" --input catalog-update.json
